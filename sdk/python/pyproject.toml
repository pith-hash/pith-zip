[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-zip"
version = "0.1.0"
description = "ZIP archive reading SDK: stored and deflated members, data descriptors and CRC verification via the pith-zip Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["zip", "archive", "extractor", "deflate", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: System :: Archiving",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-zip"
Homepage = "https://github.com/pith-hash/pith-zip"

[tool.setuptools]
packages = ["pith_zip"]

[tool.setuptools.package-data]
pith_zip = ["*.dll", "*.dylib", "*.so"]
